services:
  postgres:
    image: postgres:16-alpine
    container_name: readora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: readora_user
      POSTGRES_PASSWORD: readora_password
      POSTGRES_DB: readora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - readora-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readora_user -d readora_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: readora-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - readora-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: readora-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8000
      CLIENT_URL: http://localhost:3000
      DATABASE_URL: postgresql://readora_user:readora_password@postgres:5432/readora_db
      JWT_SECRET_KEY: readora_super_secret_jwt_key_2026
      MINIO_URL: http://localhost:9000
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: readora
      MINIO_USE_SSL: "false"
    ports:
      - "8000:8000"
    networks:
      - readora-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api
        VITE_CDN_URL: http://localhost:9000/readora
    container_name: readora-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - readora-net

volumes:
  postgres_data:
  minio_data:

networks:
  readora-net:
    driver: bridge
